name: Bug report from the game
description: Opened by the in-game Report a Galactic War Bug button with your war's details filled in. Reporting from GitHub? Use Bug report.
title: "[BUG] "
labels: ["bug"]
assignees: ["Quitch"]
body:
  - type: checkboxes
    id: attestation
    attributes:
      label: Attestation
      options:
        - label: I searched [existing issues](https://github.com/Quitch/GW-AI-Overhaul/issues?q=is%3Aissue) and this bug is not already reported
          required: true
        - label: I am not running any [incompatible mods](https://github.com/Quitch/GW-AI-Overhaul#incompatible-mods)
          required: true
        - label: I tried it with only GWO, its dependencies, and client and server mods (races, maps, etc.) required by this war. All other mods were disabled.
          required: true
        - label: I am not running any [incompatible software](https://wiki.palobby.com/wiki/Windows_Incompatible_Software)
          required: true
        - label: I have confirmed this happens after [verifying the game's files](https://support.planetaryannihilation.com/kb/faq.php?id=188)
          required: true
        - label: I was using the latest [graphics drivers](https://support.planetaryannihilation.com/kb/faq.php?id=218)
          required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    id: scene
    attributes:
      label: Where it happened
      description: "One of: War setup, Galaxy map, Exploring a system, Launching a battle, During a battle, Returning from a battle. If none fits, say where."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To reproduce
      description: Steps to reproduce the behaviour.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, drop screenshots or a video here to help explain your problem.
  - type: textarea
    id: war
    attributes:
      label: GWO info
      description: |
        Please attach a screenshot of the top-right GWO panel, including any Co-Op Settings, Incompatible Mods, Missing Races, or Missing Map Packs sections. Then copy the values below from it:

        - Mod:
        - War:
        - Seed:
        - Difficulty:
        - Size:
        - Opponent AI:
        - Ally AI:
        - Co-op AI:
        - Deck:
        - Options:
        - Faction:
        - Personality:
    validations:
      required: true
  - type: textarea
    id: coop
    attributes:
      label: Co-op
      description: |
        Leave blank if this was a solo war.

        - Were you the host or a viewer?
        - Number of players in the war:
        - Number of players the war was created for:
        - Shared Armies?
        - Per-Player Tech?
        - Player Slots:
  - type: textarea
    id: mods
    attributes:
      label: Mods
      description: List every enabled client mod and every server mod, including those run through Galactic War Server Mods. Mark which ones are race or add-on mods (e.g. Legion Expansion, Bug Faction, Exiles, Second Wave).
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Game language
      description: The language the game is set to.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drop the [client **AND** server logs](https://support.planetaryannihilation.com/kb/faq.php?id=182) from the session in which the bug happened here. Find them inside the [Planetary Annihilation Data Directory](https://support.planetaryannihilation.com/kb/faq.php?id=176). The logs record your war's settings, co-op settings, mods, and language, so you do not need to type them.
    validations:
      required: true
