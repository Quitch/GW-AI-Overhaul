version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        patterns:
          - "*"
    ignore:
      # lodash is pinned to 3.9.3 to match the version the base game ships and
      # loads at runtime (see CONTRIBUTING.md "Available Libraries"). It's a
      # devDependency used only to stub the game's global `_` for the Node test
      # harness (scripts/lib/amd-loader.js) - never shipped to players, so
      # upstream lodash CVEs don't apply here. See dismissed alerts for detail.
      - dependency-name: "lodash"
      # eslint, @eslint/js and eslint-plugin-es-x are held on 9.x. Why:
      # docs/constraints.md.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-es-x"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
