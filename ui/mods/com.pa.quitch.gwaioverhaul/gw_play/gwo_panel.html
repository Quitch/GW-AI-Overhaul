<div
  id="gwo-panel"
  class="attendmouse"
  data-bind="visible: !$root.showSystemCard() && !$root.hidingUI()"
  style="display: none"
>
  <div class="gwo-info">
    <h2><loc>Galactic War Overhaul</loc></h2>
    <div class="table">
      <div class="tablebody">
        <div class="tr">
          <!-- Deliberately left as "Mod:" with no entry rather than split into
          <loc>Mod</loc>:, which would resolve: the only "Mod" the game ships is the
          server browser's column, which means something else there ("Modifizieren"
          in de, 模型 - "model" - in zh-CN). Six more locales leave it as the English
          "Mod" anyway, so adopting it would mislead more players than it would help. -->
          <div class="td"><loc>Mod:</loc></div>
          <div class="data" data-bind="text: $root.gwoVersion"></div>
        </div>
        <!-- ko if: $root.gwoSettings -->
        <div class="tr">
          <div class="td"><loc>War:</loc></div>
          <div class="data" data-bind="text: $root.gwoSettings.version"></div>
        </div>
        <div class="tr">
          <div class="td"><loc>Difficulty:</loc></div>
          <div class="data" data-bind="text: $root.gwoDifficulty"></div>
        </div>
        <div class="tr">
          <div class="td"><loc>Size:</loc></div>
          <div class="data" data-bind="text: $root.gwoSize"></div>
        </div>
        <div class="tr">
          <div class="td"><loc>Opponent</loc> <loc>AI:</loc></div>
          <div class="data" data-bind="text: $root.gwoAI"></div>
        </div>
        <div class="tr">
          <div class="td">
            <span class="gwo-sentence-case"><loc>ALLY</loc></span>
            <loc>AI:</loc>
          </div>
          <div class="data" data-bind="text: $root.gwoAIAlly"></div>
        </div>
        <div class="tr">
          <div class="td"><loc>Deck:</loc></div>
          <div class="data" data-bind="text: $root.gwoDeck"></div>
        </div>
        <!-- /ko -->
      </div>
    </div>
    <!-- ko if: $root.gwoSettings -->
    <div class="table">
      <div
        class="tablebody"
        data-bind="visible:$root.gwoOptions().length > 0, foreach: $root.gwoOptions()"
      >
        <div class="tr">
          <div class="td">
            <span data-bind="visible:$index() === 0"><loc>Options:</loc></span>
          </div>
          <div
            class="data gwo-option"
            data-bind="text: $root.gwoOptions()[$index()]"
          ></div>
        </div>
      </div>
    </div>
    <!-- /ko -->
    <h3 id="co-op-settings" data-bind="visible:$root.gwCampaignEnabled()">
      <loc>Co-Op Settings</loc>
    </h3>
    <!-- ko if: $root.gwCampaignEnabled() -->
    <div class="table">
      <div class="tablebody">
        <div class="tr">
          <div class="td"><loc>Scaling For:</loc></div>
          <!-- The count and the word are separate spans because .gwo-sentence-case
          works through ::first-letter, and on "1 Player" the first letter is the
          digit. The word carries the class on its own so PLAYER - the only casing the
          game ships an entry for - is cased back down after translation. -->
          <div class="data">
            <span data-bind="text: $root.gwoCoopPlayerScalingCount"></span>
            <span
              class="gwo-sentence-case"
              data-bind="text: $root.gwoCoopPlayerScalingUnit"
            ></span>
          </div>
        </div>
        <div class="tr">
          <div class="td"><loc>Armies:</loc></div>
          <div class="data" data-bind="text: $root.gwoCoopArmyControl"></div>
        </div>
        <div class="tr">
          <div class="td"><loc>Tech:</loc></div>
          <div class="data" data-bind="text: $root.gwoCoopTechControl"></div>
        </div>
        <div class="tr">
          <div class="td"><loc>Player Slots:</loc></div>
          <!-- LOCKED is the only casing the game ships an entry for, so gwo_panel.js
          asks for that id and .gwo-sentence-case cases it back down here. The span is
          deliberate: the class sets display: inline-block for ::first-letter, which
          would fight the .data cell's display: table-cell if applied to it directly. -->
          <div class="data">
            <span
              class="gwo-sentence-case"
              data-bind="text: $root.gwoCoopLockedSlots"
            ></span>
          </div>
        </div>
      </div>
    </div>
    <!-- /ko -->
    <h3
      id="incompatible-mods"
      data-bind="visible:$root.gwoIncompatibleMods().length > 0"
    >
      <loc>Incompatible Mods</loc>
    </h3>
    <!-- ko if: $root.gwoIncompatibleMods -->
    <div class="table">
      <div class="tablebody" data-bind="foreach: $root.gwoIncompatibleMods()">
        <div class="tr">
          <div
            class="data"
            data-bind="text: $root.gwoIncompatibleMods()[$index()]"
          ></div>
        </div>
      </div>
    </div>
    <!-- /ko -->
    <h3 data-bind="text: $root.gwoFactionName"></h3>
    <ul data-bind="foreach: $root.gwoPlayer">
      <li class="commander">
        <div class="div-player-icon">
          <div
            class="fill player-masked"
            data-bind="style: { backgroundColor: color }"
          ></div>
          <div class="outline">
            <img
              src="coui://ui/main/game/live_game/img/players_list_panel/icon_player_outline.png"
            />
          </div>
        </div>
        <h4><span class="commander-name" data-bind="text: name"></span></h4>
        <div class="table-bottom">
          <div class="tablebody">
            <div class="tr">
              <div class="td"><loc>Personality:</loc></div>
              <div class="data" data-bind="text: character"></div>
            </div>
          </div>
        </div>
      </li>
    </ul>
  </div>
</div>
