<!-- loc ids are case sensitive, so each <loc> carries the casing the game's own
     translation files use - Opponent from matchmaking, ALLY from live_game - and
     gwo_start.css uppercases the labels to suit this panel. -->
<div class="form-group" id="difficulty-ai-enemy">
  <label id="difficulty-ai-enemy-label" for="difficulty-ai-enemy-select"
    ><loc>Opponent</loc> <loc>AI:</loc></label
  >
  <span
    class="info_tip"
    data-bind="tooltip: '!LOC:TITANS: base game AI<br>QUELLER: greater challenge at the cost of performance<br>PENCHANT: increased personality'"
    >?</span
  >
  <select
    class="form-control"
    id="difficulty-ai-enemy-select"
    data-bind="selectPicker: gwoDifficultySettings.ai"
  >
    <option value="Titans">TITANS</option>
    <option value="Queller">QUELLER</option>
    <option value="Penchant">PENCHANT</option>
  </select>
</div>
<div class="form-group" id="difficulty-ai-ally">
  <label id="difficulty-ai-ally-label" for="difficulty-ai-ally-select"
    ><loc>ALLY</loc> <loc>AI:</loc></label
  >
  <span
    class="info_tip"
    data-bind="tooltip: '!LOC:TITANS: base game AI<br>QUELLER: greater challenge at the cost of performance<br>PENCHANT: increased personality'"
    >?</span
  >
  <select
    class="form-control"
    id="difficulty-ai-ally-select"
    data-bind="selectPicker: gwoDifficultySettings.aiAlly"
  >
    <option value="Titans">TITANS</option>
    <option value="Queller">QUELLER</option>
    <option value="Penchant">PENCHANT</option>
  </select>
</div>
