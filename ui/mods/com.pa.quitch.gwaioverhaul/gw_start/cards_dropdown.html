<div class="form-group" id="difficulty-cards">
  <label id="game-cards-label" for="game-cards"><loc>TECHS</loc>:</label>
  <span class="info_tip" data-bind="tooltip: model.gwoCardsTooltip">?</span>
  <select
    class="form-control"
    id="game-cards"
    data-bind="selectPicker: gwoDifficultySettings.techCardDeck"
  >
    <!-- "Basic" matches the shipped translation key; #difficulty-cards in
    gwo_start.css uppercases it. -->
    <option value="Basic">Basic</option>
    <option value="Expanded">Galactic War Overhaul</option>
  </select>
</div>
