sonar.projectKey=Quitch_GW-AI-Overhaul
sonar.organization=quitch
sonar.projectVersion=6.14.0
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Set explicitly: this defaults to the CI runner's platform charset, which makes whether
# a file decodes cleanly depend on the machine rather than the repo. `validate:sonar`
# asserts every analysed file really is UTF-8, so the two agree.
sonar.sourceEncoding=UTF-8

# Non-source assets the scanner would otherwise try to read as UTF-8 text and warn
# on ("Invalid character encountered ... for encoding UTF-8"):
#   - **/*.png            binary image assets throughout ui/**, images/, etc. - not
#                         text in any encoding, nothing for the scanner to analyse.
#   - readme-nemuneko.txt bilingual (English/Chinese) readme whose Chinese section is
#                         saved as legacy GBK, not UTF-8 - a real encoding mismatch in
#                         a doc file, not something sonar.sourceEncoding (a single
#                         project-wide setting) can special-case per file. Keep this
#                         entry in sync with the file's name: it was once Readme!.txt,
#                         and the stale path silently reintroduced the encoding warning.
# Excluding both is correct rather than reformatting: they aren't shipped source code,
# and converting readme-nemuneko.txt would be an unrelated content change to a shipped
# asset.
sonar.exclusions=\
  **/*.png,\
  readme-nemuneko.txt

# Coverage-metric exclusions. These files are still fully analysed for bugs/smells -
# only their lines-to-cover are dropped, so a change touching only them can't drag the
# "Coverage on New Code" gate down for code that shouldn't be unit-tested in the first
# place. Every entry below is genuinely-untestable-under-the-Node-harness or has its
# correctness guarded elsewhere; this is honest scoping, not padding the metric.
#
#   - scripts/**, test/**   Node-only tooling (see CLAUDE.md), not shipped mod code.
#   - cards/**              237 tech cards. Their contract shape is enforced by
#                           `validate:cards` and their buff()/dull() AI-mod descriptors
#                           are executed and checked by `validate:ai-mods` (real
#                           behavioural enforcement, just in uninstrumented processes
#                           that don't feed lcov). The reusable logic they delegate to
#                           (shared/cards.js) stays measured. Only honest while cards
#                           stay thin - see CONTRIBUTING.md ("Coverage and new code").
#   - pure define({...}) data blobs   nothing to assert; correctness is guarded by
#                           `validate:schemas` / `validate:refs`, not unit tests.
#   - DOM / knockout / createjs UI glue   binds model/api/ko/$/createjs and the DOM at
#                           runtime, near-zero assertable logic, and can't load under
#                           the Node AMD harness (which deliberately leaves those
#                           engine globals unstubbed - see CLAUDE.md "Test harness").
#                           shared/gwo_biome_mods.js is this shape too: Community Mods
#                           manager, IndexedDB and zip-mount calls around the measured
#                           shared/gwo_biomes.js.
#   - non-module scene scripts   gw_coop_per_player_loadout/gwo_loadouts.js is not a
#                           module at all: it declares a global function and invokes it
#                           at file scope, so loading it calls requireGW immediately and
#                           there is no define() for the harness to intercept. Its one
#                           testable helper is validateStartingInventory, which is
#                           closed over inside that call - reaching it would mean
#                           extracting a measured sibling, not writing a test.
#   - referee glue whose testable core is extracted   the referee/galaxy files below
#                           (gw_per_player_tech_referee.js, referee_config.js,
#                           referee_game_files.js) are model/ko/api
#                           glue that assembles config or depends on unshipped base-game
#                           modules. Their assertable logic (ai_path resolution, army/
#                           file setup) is split into measured,
#                           unit-tested modules (gw_play/{per_player_tech,
#                           referee_config_setup,referee_game_file_paths}.js);
#                           only the residual glue is excluded.
#
# The logic layer stays measured on purpose (faction/{faction_builder,faction_seed}.js, shared/{cards,deal,ai,bank,spec_cache,specs,
# referee_ai_paths,gwo_system_templates,...}.js, gw_start/{ai_tech,gwo_teams}.js,
# gw_play/{referee_ai,treasure_loadouts,cards_coop_*,coop_ping_marker,coop_ping_operators,
# coop_selection_follow,coop_star_cards_view}.js, shared/js/gw_inventory.js and the
# extracted gw_play/{per_player_tech,referee_config_setup,referee_game_file_paths}.js and
# live_game/win_conditions_text.js)
# - new logic there must be tested. Several of those reach `model`/`ko`/`api`/`$` at call
# time; that is not grounds for exclusion, because a test can stand those up (see
# scripts/lib/global-stubs.js and the *_factory.test.js suites). Exclusion is for code the
# harness cannot load at all, or that has nothing to assert.
sonar.coverage.exclusions=\
  scripts/**,\
  test/**,\
  ui/main/game/galactic_war/cards/**,\
  ui/mods/com.pa.quitch.gwaioverhaul/gw_coop_per_player_loadout/gwo_loadouts.js,\
